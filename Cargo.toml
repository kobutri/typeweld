[workspace]
members = [
  "crates/typeweld",
  "crates/typeweld-axum",
  "crates/typeweld-cli",
  "crates/typeweld-engine",
  "crates/typeweld-ls",
  "crates/typeweld-macros",
  "crates/typeweld-syntax",
  "examples/basic",
]
exclude = ["examples/e2e", "examples/monorepo"]
resolver = "2"

[workspace.package]
categories = ["development-tools", "web-programming"]
description = "Rust-to-TypeScript API contract tooling for Effect clients"
documentation = "https://github.com/kobutri/typeweld/tree/main/docs"
edition = "2021"
homepage = "https://github.com/kobutri/typeweld"
keywords = ["api", "effect", "lsp", "rust", "typescript"]
license = "MIT OR Apache-2.0"
readme = "docs/README.md"
repository = "https://github.com/kobutri/typeweld"
version = "0.1.0"

[workspace.dependencies]
typeweld = { path = "crates/typeweld", version = "0.1.0" }
typeweld-axum = { path = "crates/typeweld-axum", version = "0.1.0" }
typeweld-engine = { path = "crates/typeweld-engine", version = "0.1.0" }
typeweld-ls = { path = "crates/typeweld-ls", version = "0.1.0" }
typeweld-macros = { path = "crates/typeweld-macros", version = "0.1.0" }
typeweld-syntax = { path = "crates/typeweld-syntax", version = "0.1.0" }

anyhow = "1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
futures-util = { version = "0.3", default-features = false }
glob = "0.3"
insta = { version = "1", features = ["json"] }
lsp-server = "0.7"
lsp-types = "0.97"
notify = "8"
oxc_allocator = "0.135"
oxc_ast = "0.135"
oxc_ast_visit = "0.135"
oxc_parser = "0.135"
oxc_span = "0.135"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
rust_decimal = { version = "1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "extra-traits", "visit", "visit-mut"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tower-layer = "0.3"
tower-service = "0.3"
trybuild = "1"
uuid = { version = "1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
