[workspace]
members = [
  "crates/typeweld-axum",
  "crates/typeweld-build",
  "crates/typeweld-cli",
  "crates/typeweld-core",
  "crates/typeweld-gen-effect-v4",
  "crates/typeweld-ir",
  "crates/typeweld-ls",
  "crates/typeweld-macros",
  "crates/typeweld-test-fixtures",
  "examples/axum-basic",
  "examples/axum-sse",
  "examples/e2e-axum-effect/server",
  "examples/monorepo-basic",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/typeweld/typeweld"
version = "0.0.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
