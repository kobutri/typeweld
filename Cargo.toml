[workspace]
members = [
  "crates/typeweld-axum",
  "crates/typeweld-build",
  "crates/typeweld-cli",
  "crates/typeweld-core",
  "crates/typeweld-gen-effect-v4",
  "crates/typeweld-ir",
  "crates/typeweld-ls",
  "crates/typeweld-macros",
  "crates/typeweld-test-fixtures",
  "examples/axum-basic",
  "examples/axum-sse",
  "examples/e2e-axum-effect/server",
  "examples/monorepo-basic",
]
resolver = "2"

[workspace.package]
categories = ["development-tools", "web-programming"]
description = "Rust-to-TypeScript API contract tooling for Effect clients"
documentation = "https://github.com/kobutri/typeweld/tree/main/docs"
edition = "2021"
homepage = "https://github.com/kobutri/typeweld"
keywords = ["api", "effect", "lsp", "rust", "typescript"]
license = "MIT OR Apache-2.0"
readme = "docs/README.md"
repository = "https://github.com/kobutri/typeweld"
version = "0.0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
