[package]
name = "api-macros"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["derive", "full", "visit-mut"] }

[dev-dependencies]
api-axum = { path = "../api-axum" }
api-core = { path = "../api-core" }
api-gen-effect-v4 = { path = "../api-gen-effect-v4" }
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio"] }
bytes = "1.11"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
trybuild = "1.0"

[lints]
workspace = true
