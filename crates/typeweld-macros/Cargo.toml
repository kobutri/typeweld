[package]
name = "typeweld-macros"
description = "Proc macros for typeweld API declarations"
categories.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }
typeweld-syntax = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
trybuild = { workspace = true }
# Path-only (no version) so cargo strips this dev-dep from the published
# manifest; with a version it would create an unpublishable cycle with the
# typeweld facade on first publish.
typeweld = { path = "../typeweld" }

[lints]
workspace = true
