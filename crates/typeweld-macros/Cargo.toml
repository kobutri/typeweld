[package]
name = "typeweld-macros"
categories.workspace = true
description.workspace = true
documentation.workspace = true
edition.workspace = true
homepage.workspace = true
keywords.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["derive", "full", "visit-mut"] }

[dev-dependencies]
typeweld-axum = { version = "0.0.5", path = "../typeweld-axum" }
typeweld-core = { version = "0.0.5", path = "../typeweld-core" }
typeweld-gen-effect-v4 = { version = "0.0.5", path = "../typeweld-gen-effect-v4" }
axum = { version = "0.8.9", default-features = false, features = ["json", "query", "tokio"] }
bytes = "1.11.1"
futures-util = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
trybuild = "1.0.116"

[lints]
workspace = true
