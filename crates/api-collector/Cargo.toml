[package]
name = "api-collector"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
api-build = { path = "../api-build" }
api-core = { path = "../api-core" }
api-gen-effect-v4 = { path = "../api-gen-effect-v4" }
api-ir = { path = "../api-ir" }
cargo_metadata = "0.19"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
api-test-fixtures = { path = "../api-test-fixtures" }

[lints]
workspace = true
