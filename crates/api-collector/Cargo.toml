[package]
name = "api-collector"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[features]
default = ["embedded-semantic-scanner"]
embedded-semantic-scanner = ["dep:deno_core"]

[dependencies]
api-build = { path = "../api-build" }
api-core = { path = "../api-core" }
api-gen-effect-v4 = { path = "../api-gen-effect-v4" }
api-ir = { path = "../api-ir" }
cargo_metadata = "0.23.1"
clap = { version = "4.6.1", features = ["derive"] }
deno_core = { version = "0.403.0", optional = true }
dialoguer = "0.12.0"
notify-debouncer-full = "0.8.0-rc.2"
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
syn = { version = "2.0.117", features = ["full"] }

[dev-dependencies]
api-test-fixtures = { path = "../api-test-fixtures" }

[lints]
workspace = true
