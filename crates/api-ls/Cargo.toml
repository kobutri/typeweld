[package]
name = "api-ls"
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "api-ls"
path = "src/main.rs"

[dependencies]
lsp-types = "0.97"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
api-gen-effect-v4 = { path = "../api-gen-effect-v4" }
api-test-fixtures = { path = "../api-test-fixtures" }

[lints]
workspace = true
