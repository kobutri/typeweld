name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: npm
      - run: |
          cargo fmt --all
          git diff --exit-code -- . ':(exclude)crates/api-test-fixtures/src/lib.rs'
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: ./examples/monorepo-basic/verify.sh
      - run: ./examples/e2e-axum-effect/verify.sh
      - run: npm test
        working-directory: npm
      - run: cargo build -p api-ls --bin api-ls --release
      - run: npm run prepare:server --workspace rust-ts-integration -- --binary "$GITHUB_WORKSPACE/target/release/api-ls" --platform-dir linux-x64
        working-directory: npm
      - run: npm run package:vsix --workspace rust-ts-integration -- --target linux-x64 --out out/rust-ts-integration-ci-linux-x64.vsix
        working-directory: npm
