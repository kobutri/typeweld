name: Release Artifacts

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.vscode-target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            vscode-target: linux-x64
            cli-binary-name: typeweld
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            vscode-target: darwin-x64
            cli-binary-name: typeweld
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            vscode-target: darwin-arm64
            cli-binary-name: typeweld
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            vscode-target: win32-x64
            cli-binary-name: typeweld.exe
    env:
      RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
        working-directory: npm
      - name: Derive extension version
        id: extension-version
        shell: bash
        run: |
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "VS Code marketplace publishing only supports non-prerelease GitHub Releases; got prerelease $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z for VS Code packaging; got $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const version = process.argv[2]
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
            console.error(`Release tag must be vX.Y.Z for VS Code packaging; got ${version}`)
            process.exit(1)
          }
          NODE
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Stamp extension manifest version
        shell: bash
        env:
          EXTENSION_VERSION: ${{ steps.extension-version.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = "npm/vscode-extension/package.json"
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"))
          manifest.version = process.env.EXTENSION_VERSION
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - run: cargo build -p typeweld-cli --bin typeweld --release --target "${{ matrix.rust-target }}"
        env:
          TYPEWELD_TEMPLATE_SOURCE: github
          TYPEWELD_TEMPLATE_VERSION: ${{ steps.extension-version.outputs.value }}
      - name: Package CLI release asset
        shell: bash
        env:
          CLI_BINARY: ${{ github.workspace }}/target/${{ matrix.rust-target }}/release/${{ matrix.cli-binary-name }}
          CLI_BINARY_NAME: ${{ matrix.cli-binary-name }}
          RELEASE_TARGET: ${{ matrix.vscode-target }}
          RELEASE_VERSION: ${{ steps.extension-version.outputs.value }}
        run: |
          python <<'PY'
          import os
          import shutil
          import stat
          import tarfile
          import zipfile
          from pathlib import Path

          binary = Path(os.environ["CLI_BINARY"])
          binary_name = os.environ["CLI_BINARY_NAME"]
          release_target = os.environ["RELEASE_TARGET"]
          release_version = os.environ["RELEASE_VERSION"]
          asset_base = f"typeweld-cli-{release_version}-{release_target}"
          out_dir = Path("release-assets/cli")
          staging = Path(os.environ["RUNNER_TEMP"]) / asset_base

          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          out_dir.mkdir(parents=True, exist_ok=True)

          packaged_binary = staging / binary_name
          shutil.copy2(binary, packaged_binary)
          packaged_binary.chmod(
              packaged_binary.stat().st_mode
              | stat.S_IXUSR
              | stat.S_IXGRP
              | stat.S_IXOTH
          )

          if release_target.startswith("win32"):
              asset = out_dir / f"{asset_base}.zip"
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  info = zipfile.ZipInfo(f"{asset_base}/{binary_name}")
                  info.external_attr = 0o755 << 16
                  with packaged_binary.open("rb") as handle:
                      archive.writestr(info, handle.read())
          else:
              asset = out_dir / f"{asset_base}.tar.gz"
              with tarfile.open(asset, "w:gz") as archive:
                  archive.add(packaged_binary, arcname=f"{asset_base}/{binary_name}")

          print(f"Wrote {asset}")
          PY
      - name: Package VSIX
        shell: bash
        env:
          TYPEWELD_TEMPLATE_SOURCE: github
          TYPEWELD_TEMPLATE_VERSION: ${{ steps.extension-version.outputs.value }}
        run: |
          npm run package:vsix --workspace typeweld-vscode -- \
            --target "${{ matrix.vscode-target }}" \
            --rust-target "${{ matrix.rust-target }}" \
            --out "out/typeweld-vscode-${{ steps.extension-version.outputs.value }}-${{ matrix.vscode-target }}.vsix"
        working-directory: npm
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.vscode-target }}
          path: npm/vscode-extension/out/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: typeweld-cli-${{ matrix.vscode-target }}
          path: release-assets/cli/*
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: vscode-extension-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: typeweld-cli-*
          merge-multiple: true
      - run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  publish-marketplaces:
    name: Publish VS Code marketplaces
    runs-on: ubuntu-latest
    needs:
      - package
      - upload-release-assets
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: npm
      - uses: actions/download-artifact@v4
        with:
          path: marketplace-assets
          pattern: vscode-extension-*
          merge-multiple: true
      - name: Validate VSIX artifacts
        shell: bash
        env:
          EXPECTED_VSCODE_EXTENSION_NAME: typeweld-vscode
          EXPECTED_VSCODE_MARKETPLACE_PUBLISHER: kobutri
        run: |
          mapfile -t vsix_files < <(find marketplace-assets -maxdepth 1 -type f -name '*.vsix' | sort)
          if [ "${#vsix_files[@]}" -ne 4 ]; then
            printf 'expected 4 platform VSIX artifacts, found %s\n' "${#vsix_files[@]}" >&2
            printf 'found artifacts:\n' >&2
            printf '  %s\n' "${vsix_files[@]}" >&2
            exit 1
          fi
          python - "${vsix_files[@]}" <<'PY'
          import json
          import os
          import sys
          import zipfile

          expected_name = os.environ["EXPECTED_VSCODE_EXTENSION_NAME"]
          expected_publisher = os.environ["EXPECTED_VSCODE_MARKETPLACE_PUBLISHER"]
          failed = False

          print("validated marketplace artifacts:")
          for vsix_file in sys.argv[1:]:
              with zipfile.ZipFile(vsix_file) as archive:
                  manifest = json.loads(archive.read("extension/package.json"))

              name = manifest.get("name")
              publisher = manifest.get("publisher")
              version = manifest.get("version")
              item_name = f"{publisher}.{name}"
              print(f"  {vsix_file}: {item_name} v{version}")

              if name != expected_name or publisher != expected_publisher:
                  print(
                      f"expected {expected_publisher}.{expected_name}, got {item_name}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)
          PY
      - name: Check marketplace credentials
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          missing=0
          if [ -z "${VSCE_PAT:-}" ]; then
            echo "missing release environment secret VSCE_PAT for Visual Studio Marketplace publishing" >&2
            missing=1
          fi
          if [ -z "${OVSX_PAT:-}" ]; then
            echo "missing release environment secret OVSX_PAT for Open VSX publishing" >&2
            missing=1
          fi
          exit "$missing"
      - name: Publish to Visual Studio Marketplace
        shell: bash
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          mapfile -t vsix_files < <(find marketplace-assets -maxdepth 1 -type f -name '*.vsix' -exec realpath {} \; | sort)
          npm --prefix npm exec --workspace typeweld-vscode -- \
            vsce publish --skip-duplicate --packagePath "${vsix_files[@]}"
      - name: Publish to Open VSX
        shell: bash
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          mapfile -t vsix_files < <(find marketplace-assets -maxdepth 1 -type f -name '*.vsix' -exec realpath {} \; | sort)
          npm --prefix npm exec --workspace typeweld-vscode -- \
            ovsx --pat "$OVSX_PAT" publish --skip-duplicate --packagePath "${vsix_files[@]}"
