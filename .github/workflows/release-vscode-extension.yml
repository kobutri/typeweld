name: Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: GitHub release tag to attach release assets to, for example v0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.vscode-target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            vscode-target: linux-x64
            binary-name: typeweld-ls
            cli-binary-name: typeweld
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            vscode-target: darwin-x64
            binary-name: typeweld-ls
            cli-binary-name: typeweld
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            vscode-target: darwin-arm64
            binary-name: typeweld-ls
            cli-binary-name: typeweld
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            vscode-target: win32-x64
            binary-name: typeweld-ls.exe
            cli-binary-name: typeweld.exe
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm ci
        working-directory: npm
      - name: Derive extension version
        id: extension-version
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          node - "$version" <<'NODE'
          const version = process.argv[2]
          if (!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(version)) {
            console.error(`Release tag must be vX.Y.Z or X.Y.Z for VS Code packaging; got ${version}`)
            process.exit(1)
          }
          NODE
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Stamp extension manifest version
        shell: bash
        env:
          EXTENSION_VERSION: ${{ steps.extension-version.outputs.value }}
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const path = "npm/vscode-extension/package.json"
          const manifest = JSON.parse(fs.readFileSync(path, "utf8"))
          manifest.version = process.env.EXTENSION_VERSION
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`)
          NODE
      - run: cargo build -p typeweld-ls --bin typeweld-ls --release --target "${{ matrix.rust-target }}"
      - run: cargo build -p typeweld-cli --bin typeweld --release --target "${{ matrix.rust-target }}"
        env:
          TYPEWELD_TEMPLATE_SOURCE: github
          TYPEWELD_TEMPLATE_VERSION: ${{ steps.extension-version.outputs.value }}
      - name: Prepare bundled language server
        shell: bash
        run: |
          npm run prepare:server --workspace typeweld-vscode -- \
            --binary "$GITHUB_WORKSPACE/target/${{ matrix.rust-target }}/release/${{ matrix.binary-name }}" \
            --typeweld-binary "$GITHUB_WORKSPACE/target/${{ matrix.rust-target }}/release/${{ matrix.cli-binary-name }}" \
            --platform-dir "${{ matrix.vscode-target }}"
        working-directory: npm
      - name: Package CLI release asset
        shell: bash
        env:
          CLI_BINARY: ${{ github.workspace }}/target/${{ matrix.rust-target }}/release/${{ matrix.cli-binary-name }}
          CLI_BINARY_NAME: ${{ matrix.cli-binary-name }}
          RELEASE_TARGET: ${{ matrix.vscode-target }}
          RELEASE_VERSION: ${{ steps.extension-version.outputs.value }}
        run: |
          python <<'PY'
          import os
          import shutil
          import stat
          import tarfile
          import zipfile
          from pathlib import Path

          binary = Path(os.environ["CLI_BINARY"])
          binary_name = os.environ["CLI_BINARY_NAME"]
          release_target = os.environ["RELEASE_TARGET"]
          release_version = os.environ["RELEASE_VERSION"]
          asset_base = f"typeweld-cli-{release_version}-{release_target}"
          out_dir = Path("release-assets/cli")
          staging = Path(os.environ["RUNNER_TEMP"]) / asset_base

          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          out_dir.mkdir(parents=True, exist_ok=True)

          packaged_binary = staging / binary_name
          shutil.copy2(binary, packaged_binary)
          packaged_binary.chmod(
              packaged_binary.stat().st_mode
              | stat.S_IXUSR
              | stat.S_IXGRP
              | stat.S_IXOTH
          )

          if release_target.startswith("win32"):
              asset = out_dir / f"{asset_base}.zip"
              with zipfile.ZipFile(asset, "w", zipfile.ZIP_DEFLATED) as archive:
                  info = zipfile.ZipInfo(f"{asset_base}/{binary_name}")
                  info.external_attr = 0o755 << 16
                  with packaged_binary.open("rb") as handle:
                      archive.writestr(info, handle.read())
          else:
              asset = out_dir / f"{asset_base}.tar.gz"
              with tarfile.open(asset, "w:gz") as archive:
                  archive.add(packaged_binary, arcname=f"{asset_base}/{binary_name}")

          print(f"Wrote {asset}")
          PY
      - name: Package VSIX
        shell: bash
        run: |
          npm run package:vsix --workspace typeweld-vscode -- \
            --target "${{ matrix.vscode-target }}" \
            --out "out/typeweld-vscode-${{ steps.extension-version.outputs.value }}-${{ matrix.vscode-target }}.vsix"
        working-directory: npm
      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension-${{ matrix.vscode-target }}
          path: npm/vscode-extension/out/*.vsix
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: typeweld-cli-${{ matrix.vscode-target }}
          path: release-assets/cli/*
          if-no-files-found: error

  upload-release-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: vscode-extension-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: typeweld-cli-*
          merge-multiple: true
      - run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
