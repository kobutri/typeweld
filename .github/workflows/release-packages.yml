name: Release Packages

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-packages-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check-release:
    name: Check release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: npm
      - name: Derive release version
        id: release-version
        shell: bash
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            echo "package publishing only supports non-prerelease GitHub Releases; got prerelease $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must be vX.Y.Z for package publishing; got $RELEASE_TAG" >&2
            exit 1
          fi

          echo "value=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - run: npm run check:versions
        working-directory: npm
      - run: cargo package -p typeweld-ir --list
      - run: cargo package -p typeweld-build --list
      - run: cargo package -p typeweld-core --list
      - run: cargo package -p typeweld-axum --list
      - run: cargo package -p typeweld-gen-effect-v4 --list
      - run: cargo package -p typeweld-macros --list
      - run: cargo package -p typeweld-cli --list
      - run: cargo package -p typeweld-ls --list
      - run: npm pack --dry-run --ignore-scripts --workspace typeweld --workspace @typeweld/effect-runtime --workspace @typeweld/language-server
        working-directory: npm

  build-npm-native-binaries:
    name: Build npm native binaries (${{ matrix.npm-platform }})
    runs-on: ${{ matrix.os }}
    needs: check-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            npm-platform: linux-x64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            npm-platform: darwin-x64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            npm-platform: darwin-arm64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            npm-platform: win32-x64
            cli-binary-name: typeweld.exe
            ls-binary-name: typeweld-ls.exe
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
        working-directory: npm
      - name: Build typeweld CLI
        run: cargo build -p typeweld-cli --bin typeweld --release --target "${{ matrix.rust-target }}"
        env:
          TYPEWELD_TEMPLATE_SOURCE: registry
          TYPEWELD_TEMPLATE_VERSION: ${{ needs.check-release.outputs.version }}
      - name: Build typeweld-ls
        run: cargo build -p typeweld-ls --bin typeweld-ls --release --target "${{ matrix.rust-target }}"
      - name: Stage native binaries
        shell: bash
        run: |
          mkdir -p "artifact/cli/${{ matrix.npm-platform }}"
          mkdir -p "artifact/language-server/${{ matrix.npm-platform }}"
          cp "target/${{ matrix.rust-target }}/release/${{ matrix.cli-binary-name }}" "artifact/cli/${{ matrix.npm-platform }}/${{ matrix.cli-binary-name }}"
          cp "target/${{ matrix.rust-target }}/release/${{ matrix.ls-binary-name }}" "artifact/language-server/${{ matrix.npm-platform }}/${{ matrix.ls-binary-name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-native-binaries-${{ matrix.npm-platform }}
          path: artifact
          if-no-files-found: error

  pack-npm:
    name: Pack npm packages
    runs-on: ubuntu-latest
    needs:
      - check-release
      - build-npm-native-binaries
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
        working-directory: npm
      - uses: actions/download-artifact@v4
        with:
          path: native-binaries
          pattern: npm-native-binaries-*
          merge-multiple: true
      - name: Install native binaries into npm packages
        shell: bash
        run: |
          native_root="native-binaries"
          if [ -d "native-binaries/artifact" ]; then
            native_root="native-binaries/artifact"
          fi

          rm -rf npm/cli/bin npm/language-server-wrapper/bin
          mkdir -p npm/cli/bin npm/language-server-wrapper/bin
          cp -R "$native_root/cli/." npm/cli/bin/
          cp -R "$native_root/language-server/." npm/language-server-wrapper/bin/
          find npm/cli/bin npm/language-server-wrapper/bin -type f -exec chmod 755 {} \;
      - run: npm run build --workspace typeweld
        working-directory: npm
      - run: npm run build --workspace @typeweld/language-server
        working-directory: npm
      - name: Pack npm tarballs
        shell: bash
        run: |
          mkdir -p ../npm-packs
          npm pack \
            --ignore-scripts \
            --workspace typeweld \
            --workspace @typeweld/effect-runtime \
            --workspace @typeweld/language-server \
            --pack-destination ../npm-packs
        working-directory: npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package-tarballs
          path: npm-packs/*.tgz
          if-no-files-found: error

  publish-registries:
    name: Publish crates.io and npm
    runs-on: ubuntu-latest
    needs:
      - check-release
      - pack-npm
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.check-release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: npm-package-tarballs
          path: npm-packs
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe
      - name: Publish Rust crates
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          crate_is_published() {
            local crate="$1"
            curl --silent --fail "https://crates.io/api/v1/crates/$crate/$RELEASE_VERSION" >/dev/null
          }

          publish_crate() {
            local crate="$1"
            if crate_is_published "$crate"; then
              echo "$crate@$RELEASE_VERSION is already published; skipping"
              return
            fi

            local attempt
            for attempt in 1 2 3 4 5; do
              echo "publishing $crate@$RELEASE_VERSION (attempt $attempt)"
              if cargo publish -p "$crate" --no-verify; then
                return
              fi
              sleep "$((attempt * 20))"
            done

            echo "failed to publish $crate@$RELEASE_VERSION" >&2
            exit 1
          }

          publish_crate typeweld-ir
          publish_crate typeweld-build
          publish_crate typeweld-core
          publish_crate typeweld-axum
          publish_crate typeweld-gen-effect-v4
          publish_crate typeweld-macros
          publish_crate typeweld-cli
          publish_crate typeweld-ls
      - name: Publish npm packages
        shell: bash
        run: |
          package_is_published() {
            local package="$1"
            npm view "$package@$RELEASE_VERSION" version --registry https://registry.npmjs.org --silent >/dev/null 2>&1
          }

          publish_npm_package() {
            local package="$1"
            local tarball="$2"
            if package_is_published "$package"; then
              echo "$package@$RELEASE_VERSION is already published; skipping"
              return
            fi
            if [ ! -f "$tarball" ]; then
              echo "missing npm package tarball $tarball" >&2
              exit 1
            fi
            npm publish "$(realpath "$tarball")" --ignore-scripts --access public
          }

          publish_npm_package "@typeweld/effect-runtime" "npm-packs/typeweld-effect-runtime-$RELEASE_VERSION.tgz"
          publish_npm_package "@typeweld/language-server" "npm-packs/typeweld-language-server-$RELEASE_VERSION.tgz"
          publish_npm_package "typeweld" "npm-packs/typeweld-$RELEASE_VERSION.tgz"
