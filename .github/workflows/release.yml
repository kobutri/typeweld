name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install pinned toolchain and cross target
        # rust-toolchain.toml routes cargo through the pinned toolchain, so the
        # cross target must be added to that toolchain, not to `stable`.
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
      - run: cargo build --release -p typeweld-cli --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p staged/bin/${{ matrix.platform }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/typeweld.exe staged/bin/${{ matrix.platform }}/
          else
            cp target/${{ matrix.target }}/release/typeweld staged/bin/${{ matrix.platform }}/
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typeweld-${{ matrix.platform }}
          path: staged/bin
          if-no-files-found: error

  publish-crates:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "typeweld") | .version')

          publish_crate() {
            local crate="$1"
            if curl --silent --fail "https://crates.io/api/v1/crates/$crate/$version" >/dev/null; then
              echo "$crate@$version is already published; skipping"
              return
            fi
            local attempt
            for attempt in 1 2 3 4 5; do
              echo "publishing $crate@$version (attempt $attempt)"
              if cargo publish -p "$crate"; then
                return
              fi
              sleep "$((attempt * 20))"
            done
            echo "failed to publish $crate@$version" >&2
            exit 1
          }

          publish_crate typeweld-syntax
          publish_crate typeweld-engine
          publish_crate typeweld-axum
          publish_crate typeweld-macros
          publish_crate typeweld-ls
          publish_crate typeweld
          publish_crate typeweld-cli

  publish-npm:
    name: Publish npm packages
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - run: npm ci
        working-directory: npm
      - name: Assemble platform packages
        run: node scripts/assemble-platform-packages.mts artifacts dist-platform
      - name: Publish platform binary packages
        run: |
          for dir in dist-platform/*; do
            npm publish "$dir" --provenance --access public
          done
      - name: Inject platform optionalDependencies into the launcher
        run: node scripts/inject-platform-optional-deps.mjs
      - name: Build and publish the launcher and runtime
        run: |
          npm run build --workspace typeweld
          npm run build --workspace @typeweld/typescript-plugin
          npm publish --workspace typeweld --provenance --access public
          npm publish --workspace @typeweld/effect-runtime --provenance --access public
          npm publish --workspace @typeweld/typescript-plugin --provenance --access public
        working-directory: npm

  publish-extension:
    name: Publish VS Code extension
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - run: npm ci
        working-directory: npm
      - name: Bundle extension with binaries
        run: |
          npm run compile --workspace typeweld-vscode
          mkdir -p npm/vscode-extension/bin
          cp -r artifacts/typeweld-*/. npm/vscode-extension/bin/
      - name: Package VSIX
        run: npm run package:vsix --workspace typeweld-vscode
        working-directory: npm
      - name: Publish to Marketplace and OpenVSX
        if: ${{ !github.event.release.prerelease }}
        run: |
          npx --yes @vscode/vsce publish --packagePath npm/vscode-extension/typeweld.vsix -p "$VSCE_PAT"
          npx --yes ovsx publish npm/vscode-extension/typeweld.vsix -p "$OVSX_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
