name: Publish Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version being published, for example 0.1.0. Leave empty to use Cargo.toml.
        required: false
        type: string
      dry_run:
        description: Run packaging checks without publishing.
        required: true
        default: true
        type: boolean
      publish_crates:
        description: Publish Rust crates to crates.io.
        required: true
        default: false
        type: boolean
      publish_npm:
        description: Publish npm packages to npm.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-crates:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_crates }}
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Authenticate to crates.io
        id: auth
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crates in dependency order
        shell: bash
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          CRATES_IO_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail

          crates=(
            typeweld-ir
            typeweld-build
            typeweld-core
            typeweld-axum
            typeweld-gen-effect-v4
            typeweld-macros
            typeweld-cli
            typeweld-ls
          )

          if [ "$DRY_RUN" = "true" ]; then
            cargo publish -p typeweld-ir --dry-run
            cargo publish -p typeweld-build --dry-run
            echo "Skipped dry-runs for crates with unpublished internal Typeweld dependencies."
            echo "After the first publish, run cargo publish --dry-run locally or in this workflow for each crate."
            exit 0
          fi

          for crate in "${crates[@]}"; do
            cargo publish -p "$crate" --token "$CRATES_IO_TOKEN"
            sleep 30
          done

  build-npm-binaries:
    name: Build npm binaries (${{ matrix.platform-dir }})
    runs-on: ${{ matrix.os }}
    if: ${{ inputs.publish_npm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            platform-dir: linux-x64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: macos-latest
            rust-target: x86_64-apple-darwin
            platform-dir: darwin-x64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            platform-dir: darwin-arm64
            cli-binary-name: typeweld
            ls-binary-name: typeweld-ls
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            platform-dir: win32-x64
            cli-binary-name: typeweld.exe
            ls-binary-name: typeweld-ls.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
        working-directory: npm
      - name: Derive package version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then
            version="$(cargo metadata --format-version 1 --no-deps | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => { const data = JSON.parse(input); console.log(data.packages.find(pkg => pkg.name === "typeweld-cli").version); })')"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - run: cargo build -p typeweld-ls --bin typeweld-ls --release --target "${{ matrix.rust-target }}"
      - run: cargo build -p typeweld-cli --bin typeweld --release --target "${{ matrix.rust-target }}"
        env:
          TYPEWELD_TEMPLATE_SOURCE: registry
          TYPEWELD_TEMPLATE_VERSION: ${{ steps.version.outputs.value }}
      - name: Prepare npm package binaries
        shell: bash
        run: |
          npm run prepare:binary --workspace typeweld -- \
            --typeweld-binary "$GITHUB_WORKSPACE/target/${{ matrix.rust-target }}/release/${{ matrix.cli-binary-name }}" \
            --platform-dir "${{ matrix.platform-dir }}"
          npm run prepare:binary --workspace @typeweld/language-server -- \
            --binary "$GITHUB_WORKSPACE/target/${{ matrix.rust-target }}/release/${{ matrix.ls-binary-name }}" \
            --platform-dir "${{ matrix.platform-dir }}"
        working-directory: npm
      - uses: actions/upload-artifact@v4
        with:
          name: npm-binaries-${{ matrix.platform-dir }}
          path: |
            npm/cli/bin/${{ matrix.platform-dir }}/*
            npm/language-server-wrapper/bin/${{ matrix.platform-dir }}/*
          if-no-files-found: error

  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_npm }}
    needs: build-npm-binaries
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: npm/package-lock.json
      - run: npm ci
        working-directory: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-binaries-*
          path: npm-binaries
      - name: Restore package binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p npm/cli/bin npm/language-server-wrapper/bin
          find npm-binaries -path '*/npm/cli/bin/*' -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#*/npm/cli/bin/}"
            mkdir -p "npm/cli/bin/$(dirname "$relative")"
            cp "$file" "npm/cli/bin/$relative"
          done
          find npm-binaries -path '*/npm/language-server-wrapper/bin/*' -type f -print0 | while IFS= read -r -d '' file; do
            relative="${file#*/npm/language-server-wrapper/bin/}"
            mkdir -p "npm/language-server-wrapper/bin/$(dirname "$relative")"
            cp "$file" "npm/language-server-wrapper/bin/$relative"
          done
      - name: Pack npm packages
        run: |
          npm pack --dry-run --workspace @typeweld/effect-runtime
          npm pack --dry-run --workspace @typeweld/language-server
          npm pack --dry-run --workspace typeweld
        working-directory: npm
      - name: Publish npm packages
        if: ${{ !inputs.dry_run }}
        run: |
          npm publish --workspace @typeweld/effect-runtime
          npm publish --workspace @typeweld/language-server
          npm publish --workspace typeweld
        working-directory: npm
